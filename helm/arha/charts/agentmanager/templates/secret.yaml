# Secret用stringData（不是data）欄位，可以直接寫明碼字串，Kubernetes會自動
# base64編碼後存進etcd——不用像用data欄位時得自己先手動base64。
# 這仍然只是「不讓密碼明晃晃寫在Deployment yaml跟git repo裡」的基本防護，
# base64不是加密，etcd本身沒開靜態加密的話Secret內容還是能被有叢集存取權的人
# 讀到；正式環境要更嚴謹的話應該搭配外部密鑰管理（Vault、AWS Secrets Manager
# 等）或至少開啟etcd encryption at rest，這裡先示範Helm最基本正確的作法。
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentmanager.fullname" . }}-agenthost
  namespace: {{ include "agentmanager.namespace" . }}
type: Opaque
stringData:
  ip: {{ .Values.agentHost.ip | quote }}
  account: {{ .Values.agentHost.account | quote }}
  password: {{ .Values.agentHost.password | quote }}
