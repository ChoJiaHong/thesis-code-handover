apiVersion: v1
kind: Service
metadata:
  name: monitor-service
  namespace: {{ include "monitor.namespace" . }}
spec:
  type: NodePort
  selector:
    app: monitor
  externalTrafficPolicy: Local
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      nodePort: {{ .Values.service.nodePort }}
