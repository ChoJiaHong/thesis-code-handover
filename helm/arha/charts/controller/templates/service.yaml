apiVersion: v1
kind: Service
metadata:
  name: controller-service
  namespace: {{ include "controller.namespace" . }}
spec:
  type: NodePort
  selector:
    app: controller
  externalTrafficPolicy: Local
  ports:
    - name: controller
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      nodePort: {{ .Values.service.nodePort }}
    {{- if .Values.extraContainers.enabled }}
    - name: result
      protocol: TCP
      port: 81
      targetPort: 5001
      nodePort: 30006
    {{- end }}
